<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>칠판 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 화면 구성: 위에 점수판, 가운데 나무틀 칠판(게임 화면), 아래 버튼. 프로젝터에서도 잘 보이도록 큰 글씨 */
:root {
  --board: #22382f;
  --board-deep: #1a2c25;
  --wood: #8a5a34;
  --wood-dark: #5e3a1f;
  --chalk: #f1efe6;
  --chalk-dim: #c9d1c7;
  --yellow: #f5d77a;
  --pink: #f4a9b8;
  --room: #2b2420;
  --display: "Gaegu", "Comic Sans MS", cursive, sans-serif;
  --mono: "Nanum Gothic Coding", "Malgun Gothic", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--room);
  color: var(--chalk);
  font-family: var(--mono);
  font-size: 20px;
  display: flex; flex-direction: column; align-items: center;
  padding-inline: 16px; padding-block: 12px;
}
.wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 900px; }
header { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 3rem; margin: 0; line-height: 1; }
h1 span { color: var(--yellow); }
.hud { display: flex; gap: 12px 28px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: 1.3rem; color: var(--chalk-dim); }
.hud div { display: flex; align-items: baseline; gap: 8px; }
.hud b { color: var(--chalk); font-size: 1.8rem; }
.hud .lives b { color: var(--pink); letter-spacing: 2px; }
.frame {
  background: linear-gradient(180deg, var(--wood), var(--wood-dark));
  padding: 12px 12px 8px; border-radius: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.15);
  position: relative; max-width: 100%;
}
canvas {
  display: block;
  height: min(calc(100vh - 240px), calc((100vw - 56px) * 4 / 3));
  min-height: 320px;
  aspect-ratio: 3 / 4; max-width: 100%;
  background: radial-gradient(ellipse at 50% 30%, var(--board), var(--board-deep));
  border-radius: 2px; touch-action: none; cursor: none;
}
.tray { height: 8px; margin-top: 8px; background: var(--wood-dark); border-radius: 2px; position: relative; }
.tray::before { content: ""; position: absolute; left: 18%; top: -3px; width: 40px; height: 7px; background: var(--chalk); border-radius: 2px; }
.tray::after { content: ""; position: absolute; left: 28%; top: -2px; width: 26px; height: 6px; background: var(--pink); border-radius: 2px; }
.overlay {
  position: absolute; inset: 12px 12px 28px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 20px;
  background: rgba(26,44,37,.88); border-radius: 2px;
}
.overlay[hidden] { display: none; }
.overlay h2 { font-family: var(--display); font-size: 3.4rem; margin: 0; line-height: 1.05; }
.overlay p { margin: 0; color: var(--chalk-dim); font-size: 1.25rem; line-height: 1.6; max-width: 22em; word-break: keep-all; }
button {
  font-family: var(--display); font-weight: 700; font-size: 2rem;
  background: transparent; color: var(--chalk); border: 3px dashed var(--chalk);
  padding: 6px 30px; border-radius: 12px; cursor: pointer;
}
button:hover { background: rgba(241,239,230,.1); }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.controls { width: 100%; display: flex; gap: 10px 20px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.controls small { color: #c4b3a6; font-size: 1.1rem; line-height: 1.5; word-break: keep-all; }
.controls .btns { display: flex; gap: 10px; }
.controls button { font-size: 1.5rem; padding: 2px 18px; border-width: 2px; color: #eadfd4; border-color: #b5a395; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>칠판 <span>벽돌깨기</span></h1>
    <div class="hud" aria-live="polite">
      <div>점수 <b id="score">0</b></div>
      <div>단계 <b id="level">1/3</b></div>
      <div class="lives">생명 <b id="lives">♥♥♥♥♥</b></div>
      <div>최고 <b id="best">0</b></div>
    </div>
  </header>

  <div class="frame">
    <canvas id="game" width="480" height="640" aria-label="벽돌깨기 게임 화면"></canvas>
    <div class="tray"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">준비됐나요?</h2>
      <p id="ovText">마우스나 손가락, ← → 키로 막대를 움직여요. 숫자가 적힌 벽돌은 그 숫자만큼 맞혀야 깨져요. 모두 3단계이고, 단계가 오를수록 공이 빨라져요. 생명은 5개!</p>
      <button id="startBtn" type="button">시작하기</button>
    </div>
  </div>

  <div class="controls">
    <small>스페이스: 공 발사 / 일시정지 · 숫자 벽돌은 여러 번 맞혀야 깨져요</small>
    <div class="btns">
      <button id="soundBtn" type="button">소리 켬</button>
      <button id="pauseBtn" type="button">일시정지</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- 기본 설정 ----------
  const W = 480, H = 640;
  const MAX_LIVES = 5;               // 생명 최대 5개
  const MAX_LEVEL = 3;               // 모두 3단계
  const SPEED = [0, 4.5, 6, 7.5];    // 단계별 공 속도 (1단계 → 3단계로 빨라짐)
  const COLORS = ['#f4a9b8', '#f5d77a', '#9fd3f0', '#a8e6c1', '#f1efe6'];

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- 게임 상태 ----------
  let state = 'ready';   // ready(시작 전) | play(진행) | paused(일시정지) | clear(단계 통과) | over(실패) | win(전부 통과)
  let score = 0;         // 점수는 0에서 시작
  let lives = MAX_LIVES;
  let level = 1;
  let best = 0;
  try { best = +localStorage.getItem('brick-best') || 0; } catch (e) {}
  let soundOn = true;

  const paddle = { w: 96, h: 14, x: W / 2 - 48, y: H - 46, speed: 9 };
  let ball = null;
  let bricks = [];
  let particles = [];
  const keys = { left: false, right: false };

  // ---------- 소리 ----------
  let ac = null;
  function beep(freq, dur = 0.06, type = 'square', vol = 0.05) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  // ---------- 단계별 벽돌 만들기 ----------
  function buildLevel(n) {
    bricks = [];
    const cols = 8, rows = 4 + n;              // 1단계 5줄, 2단계 6줄, 3단계 7줄
    const gap = 6, top = 60, side = 20;
    const bw = (W - side * 2 - gap * (cols - 1)) / cols, bh = 22;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (n === 2 && (r + c) % 2 === 1 && r > 0) continue;   // 2단계: 체크 무늬
        // 벽돌을 깨려면 맞혀야 하는 횟수 (위쪽 줄일수록 단단함)
        let hp = 1;
        if (n === 1) hp = r < 2 ? 2 : 1;                        // 1단계: 위 2줄은 2번
        if (n === 2) hp = r < 1 ? 3 : (r < 3 ? 2 : 1);          // 2단계: 3번·2번·1번
        if (n === 3) hp = r < 2 ? 3 : (r < 4 ? 2 : 1);          // 3단계: 3번·2번·1번
        bricks.push({
          x: side + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh,
          hp, maxHp: hp, color: COLORS[r % COLORS.length], wob: Math.random() * 2 - 1
        });
      }
    }
  }

  function newBall() {
    return { x: paddle.x + paddle.w / 2, y: paddle.y - 10, r: 8, vx: 0, vy: 0, speed: SPEED[level], stuck: true };
  }

  function launch() {
    if (!ball || !ball.stuck) return;
    const ang = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(ang) * ball.speed;
    ball.vy = Math.sin(ang) * ball.speed;
    ball.stuck = false;
    beep(520, .08, 'triangle');
  }

  function resetGame() {
    score = 0; lives = MAX_LIVES; level = 1;
    buildLevel(level); ball = newBall(); particles = [];
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('level').textContent = level + '/' + MAX_LEVEL;
    $('lives').textContent = lives > 0 ? '♥'.repeat(lives) + '♡'.repeat(MAX_LIVES - lives) : '♡'.repeat(MAX_LIVES);
    if (score > best) { best = score; try { localStorage.setItem('brick-best', best); } catch (e) {} }
    $('best').textContent = best;
  }

  // ---------- 안내 화면 ----------
  function showOverlay(title, text, btn) {
    $('ovTitle').textContent = title;
    $('ovText').textContent = text;
    $('startBtn').textContent = btn;
    $('overlay').hidden = false;
  }
  function hideOverlay() { $('overlay').hidden = true; }

  $('startBtn').addEventListener('click', () => {
    if (state === 'ready' || state === 'over' || state === 'win') { resetGame(); state = 'play'; }
    else if (state === 'clear') { level++; buildLevel(level); ball = newBall(); particles = []; updateHud(); state = 'play'; }
    else if (state === 'paused') state = 'play';
    hideOverlay(); beep(660, .1, 'triangle');
  });

  function togglePause() {
    if (state === 'play') { state = 'paused'; showOverlay('잠깐 쉬는 중', '준비되면 다시 시작하세요.', '계속하기'); }
    else if (state === 'paused') { state = 'play'; hideOverlay(); }
  }
  $('pauseBtn').addEventListener('click', togglePause);
  $('soundBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    $('soundBtn').textContent = soundOn ? '소리 켬' : '소리 끔';
  });

  // ---------- 입력 (마우스·터치·키보드) ----------
  function pointerX(e) {
    const rect = cv.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width * W;
  }
  function movePaddleTo(x) { paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2)); }
  cv.addEventListener('pointermove', e => { if (state === 'play') movePaddleTo(pointerX(e)); });
  cv.addEventListener('pointerdown', e => { if (state === 'play') { movePaddleTo(pointerX(e)); launch(); } });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === ' ') {
      if (e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      if (state === 'play' && ball.stuck) launch(); else togglePause();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  // ---------- 효과 ----------
  function burst(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({ x, y, vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4 - 1, life: 30, color });
    }
  }

  // ---------- 움직임과 충돌 ----------
  function update() {
    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    const b = ball;
    if (b.stuck) {
      b.x = paddle.x + paddle.w / 2; b.y = paddle.y - b.r - 2;
    } else {
      // 빠른 공이 벽돌을 뚫고 지나가지 않도록 여러 번 나눠서 이동
      const steps = Math.ceil(b.speed / 3);
      for (let s = 0; s < steps; s++) {
        b.x += b.vx / steps; b.y += b.vy / steps;

        // 벽에 부딪힘
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); beep(300, .03); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(300, .03); }
        if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); beep(300, .03); }

        // 막대에 부딪힘: 맞은 위치에 따라 튕기는 각도가 달라짐
        if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
            b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r) {
          const hit = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
          b.vx = Math.sin(ang) * b.speed; b.vy = -Math.cos(ang) * b.speed;
          b.y = paddle.y - b.r; beep(440, .05, 'triangle');
        }

        // 벽돌에 부딪힘
        for (const br of bricks) {
          if (br.hp <= 0) continue;
          const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
          const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
          const dx = b.x - cx, dy = b.y - cy;
          if (dx * dx + dy * dy <= b.r * b.r) {
            const overX = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
            const overY = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
            if (overX < overY) b.vx = -b.vx; else b.vy = -b.vy;
            br.hp--;
            if (br.hp <= 0) {
              score += 10 * br.maxHp;
              burst(br.x + br.w / 2, br.y + br.h / 2, br.color);
              beep(700 + Math.random() * 300, .07);
            } else { score += 2; beep(220, .05); }
            updateHud();
            break;
          }
        }
      }
    }

    // 공을 놓침
    if (b.y - b.r > H) {
      lives--; updateHud(); beep(150, .3, 'sawtooth', .06);
      if (lives <= 0) {
        state = 'over';
        showOverlay('게임 끝', `${level}단계에서 생명을 모두 잃었어요. 최종 점수 ${score}점!`, '다시 하기');
      } else ball = newBall();
    }

    // 단계 통과
    if (state === 'play' && bricks.every(br => br.hp <= 0)) {
      score += 100 * level; updateHud();
      beep(523, .1, 'triangle'); setTimeout(() => beep(784, .15, 'triangle'), 110);
      if (level >= MAX_LEVEL) {
        state = 'win';
        showOverlay('모든 단계 통과!', `축하해요! 3단계를 모두 깼어요. 최종 점수 ${score}점, 남은 생명 ${lives}개.`, '처음부터');
      } else {
        state = 'clear';
        showOverlay(`${level}단계 통과!`, `보너스 ${100 * level}점! 다음 ${level + 1}단계는 공이 더 빨라져요.`, '다음 단계');
      }
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- 그리기 ----------
  function chalkRect(x, y, w, h, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = alpha * 0.25;      // 분필 질감 줄무늬
    ctx.fillStyle = '#22382f';
    for (let i = 3; i < w; i += 7) ctx.fillRect(x + i, y + 2, 1.5, h - 4);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 단계 표시 (칠판 글씨)
    ctx.fillStyle = 'rgba(241,239,230,.35)';
    ctx.font = 'bold 28px Gaegu, cursive';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(level + '단계', 20, 42);

    for (const br of bricks) {
      if (br.hp <= 0) continue;
      ctx.save();
      ctx.translate(br.x + br.w / 2, br.y + br.h / 2);
      ctx.rotate(br.wob * 0.012);
      chalkRect(-br.w / 2, -br.h / 2, br.w, br.h, br.color, 0.5 + 0.5 * (br.hp / br.maxHp));
      // 한 번 이상 맞은 벽돌에는 금이 간 자국 표시
      if (br.hp < br.maxHp) {
        ctx.strokeStyle = '#1a2c25'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-br.w / 2 + 6, -br.h / 2 + 3);
        ctx.lineTo(-br.w / 2 + 14, 2);
        ctx.lineTo(-br.w / 2 + 10, br.h / 2 - 3);
        if (br.maxHp - br.hp >= 2) {
          ctx.moveTo(br.w / 2 - 6, -br.h / 2 + 3);
          ctx.lineTo(br.w / 2 - 13, 0);
          ctx.lineTo(br.w / 2 - 8, br.h / 2 - 3);
        }
        ctx.stroke();
      }
      if (br.maxHp > 1) {
        ctx.fillStyle = '#1a2c25';
        ctx.font = 'bold 18px "Nanum Gothic Coding", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(br.hp, 0, 1);
      }
      ctx.restore();
    }

    for (const p of particles) {
      ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 4, 4);
    }
    ctx.globalAlpha = 1;

    // 막대 (칠판 지우개 모양)
    ctx.fillStyle = '#5e3a1f'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fillStyle = '#d9cfc0'; ctx.fillRect(paddle.x, paddle.y + paddle.h - 5, paddle.w, 5);

    // 공
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#f1efe6'; ctx.fill();

    if (state === 'play' && ball.stuck) {
      ctx.fillStyle = 'rgba(241,239,230,.85)';
      ctx.font = 'bold 30px Gaegu, cursive'; ctx.textAlign = 'center';
      ctx.fillText('클릭 또는 스페이스로 발사!', W / 2, H - 100);
    }
  }

  function loop() {
    if (state === 'play') update();
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(1); ball = newBall(); updateHud();
  loop();
})();
</script>
</body>
</html>
